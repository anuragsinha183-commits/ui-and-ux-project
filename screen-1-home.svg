<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" style="background:#FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <style>
      .bg { fill: #FAFAFA; }
      .box { fill: #F3F4F6; stroke: #D1D5DB; stroke-width: 1; }
      .box-dashed { fill: #F9FAFB; stroke: #9CA3AF; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .text-title { font-size: 16px; font-weight: 700; fill: #111827; }
      .text-subtitle { font-size: 13px; font-weight: 600; fill: #374151; }
      .text-body { font-size: 11px; fill: #6B7280; }
      .text-badge { font-size: 10px; font-weight: 600; fill: #4B5563; }
      .btn-primary { fill: #1F2937; rx: 8; }
      .btn-text { font-size: 13px; font-weight: 600; fill: #FFFFFF; text-anchor: middle; }
      .placeholder-line { stroke: #D1D5DB; stroke-width: 1.5; stroke-linecap: round; }
    </style>
  </defs>

  <!-- Frame Background -->
  <rect width="390" height="844" rx="36" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2"/>

  <!-- Status Bar -->
  <text x="28" y="32" font-size="12" font-weight="600" fill="#111827">9:41</text>
  <circle cx="330" cy="28" r="3" fill="#111827"/>
  <rect x="340" y="23" width="20" height="10" rx="3" fill="none" stroke="#111827" stroke-width="1.5"/>
  <rect x="342" y="25" width="13" height="6" rx="1" fill="#111827"/>

  <!-- App Header / Location -->
  <g transform="translate(20, 52)">
    <text x="0" y="10" class="text-body">DELIVER TO</text>
    <text x="0" y="28" class="text-title">Home • 742 Evergreen Terr ▼</text>
    <circle cx="320" cy="18" r="18" class="box"/>
    <!-- User Icon placeholder -->
    <circle cx="320" cy="14" r="6" fill="#9CA3AF"/>
    <path d="M312 28 C312 23 328 23 328 28" fill="#9CA3AF"/>
  </g>

  <!-- Search Bar -->
  <g transform="translate(20, 110)">
    <rect width="350" height="42" rx="10" class="box"/>
    <!-- Search Magnifier Icon -->
    <circle cx="20" cy="21" r="5.5" fill="none" stroke="#6B7280" stroke-width="1.5"/>
    <line x1="24" y1="25" x2="29" y2="30" stroke="#6B7280" stroke-width="1.5" stroke-linecap="round"/>
    <text x="38" y="26" class="text-body" fill="#9CA3AF">Search dishes, restaurants, groceries...</text>
    <!-- Filter icon -->
    <rect x="316" y="11" width="20" height="20" rx="4" fill="#E5E7EB"/>
    <line x1="320" y1="17" x2="332" y2="17" stroke="#4B5563" stroke-width="1.5"/>
    <line x1="323" y1="21" x2="329" y2="21" stroke="#4B5563" stroke-width="1.5"/>
    <line x1="325" y1="25" x2="327" y2="25" stroke="#4B5563" stroke-width="1.5"/>
  </g>

  <!-- Promo Banner Placeholder -->
  <g transform="translate(20, 168)">
    <rect width="350" height="110" rx="14" class="box-dashed"/>
    <!-- Image crossed placeholder -->
    <line x1="0" y1="0" x2="350" y2="110" stroke="#E5E7EB" stroke-width="1"/>
    <line x1="0" y1="110" x2="350" y2="0" stroke="#E5E7EB" stroke-width="1"/>
    <rect x="16" y="22" width="160" height="16" rx="4" fill="#E5E7EB"/>
    <rect x="16" y="46" width="110" height="12" rx="4" fill="#E5E7EB"/>
    <rect x="16" y="68" width="90" height="24" rx="6" fill="#1F2937"/>
    <text x="61" y="84" class="btn-text" font-size="10">CLAIM OFFER</text>
    <!-- Circle badge placeholder -->
    <circle cx="290" cy="55" r="34" class="box"/>
    <text x="290" y="58" class="text-subtitle" text-anchor="middle">50% OFF</text>
  </g>

  <!-- Categories Section -->
  <g transform="translate(20, 298)">
    <text x="0" y="12" class="text-subtitle">Categories</text>
    <text x="350" y="12" class="text-body" text-anchor="end">See all &gt;</text>
    
    <!-- Category Items -->
    <!-- Cat 1 (Active) -->
    <g transform="translate(0, 24)">
      <rect width="58" height="66" rx="12" fill="#1F2937"/>
      <circle cx="29" cy="24" r="16" fill="#374151"/>
      <text x="29" y="54" font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="middle">All</text>
    </g>
    <!-- Cat 2 -->
    <g transform="translate(73, 24)">
      <rect width="58" height="66" rx="12" class="box"/>
      <circle cx="29" cy="24" r="16" fill="#E5E7EB"/>
      <text x="29" y="54" font-size="10" font-weight="600" fill="#4B5563" text-anchor="middle">Pizza</text>
    </g>
    <!-- Cat 3 -->
    <g transform="translate(146, 24)">
      <rect width="58" height="66" rx="12" class="box"/>
      <circle cx="29" cy="24" r="16" fill="#E5E7EB"/>
      <text x="29" y="54" font-size="10" font-weight="600" fill="#4B5563" text-anchor="middle">Burger</text>
    </g>
    <!-- Cat 4 -->
    <g transform="translate(219, 24)">
      <rect width="58" height="66" rx="12" class="box"/>
      <circle cx="29" cy="24" r="16" fill="#E5E7EB"/>
      <text x="29" y="54" font-size="10" font-weight="600" fill="#4B5563" text-anchor="middle">Asian</text>
    </g>
    <!-- Cat 5 -->
    <g transform="translate(292, 24)">
      <rect width="58" height="66" rx="12" class="box"/>
      <circle cx="29" cy="24" r="16" fill="#E5E7EB"/>
      <text x="29" y="54" font-size="10" font-weight="600" fill="#4B5563" text-anchor="middle">Dessert</text>
    </g>
  </g>

  <!-- Popular Restaurants Section -->
  <g transform="translate(20, 412)">
    <text x="0" y="14" class="text-subtitle">Popular Near You</text>
    <text x="350" y="14" class="text-body" text-anchor="end">View map &gt;</text>

    <!-- Card 1 -->
    <g transform="translate(0, 28)">
      <rect width="350" height="142" rx="14" class="box"/>
      <!-- Image box with cross placeholder -->
      <rect x="0" y="0" width="350" height="88" rx="14" fill="#E5E7EB"/>
      <line x1="0" y1="0" x2="350" y2="88" stroke="#D1D5DB" stroke-width="1"/>
      <line x1="0" y1="88" x2="350" y2="0" stroke="#D1D5DB" stroke-width="1"/>
      <!-- Time Pill -->
      <rect x="12" y="58" width="70" height="20" rx="10" fill="#1F2937" opacity="0.85"/>
      <text x="47" y="72" font-size="9" fill="#FFF" font-weight="600" text-anchor="middle">20-30 min</text>
      <!-- Title & Rating -->
      <text x="12" y="108" class="text-subtitle">Burger Craft &amp; Co.</text>
      <text x="12" y="124" class="text-body">Burgers • American • $$ • 1.2 km away</text>
      <!-- Rating badge -->
      <rect x="300" y="96" width="38" height="20" rx="6" fill="#E5E7EB"/>
      <text x="319" y="110" font-size="10" font-weight="700" fill="#1F2937" text-anchor="middle">★ 4.8</text>
    </g>

    <!-- Card 2 (Partial/Stacked) -->
    <g transform="translate(0, 184)">
      <rect width="350" height="140" rx="14" class="box"/>
      <rect x="0" y="0" width="350" height="84" rx="14" fill="#E5E7EB"/>
      <line x1="0" y1="0" x2="350" y2="84" stroke="#D1D5DB" stroke-width="1"/>
      <line x1="0" y1="84" x2="350" y2="0" stroke="#D1D5DB" stroke-width="1"/>
      <rect x="12" y="54" width="70" height="20" rx="10" fill="#1F2937" opacity="0.85"/>
      <text x="47" y="68" font-size="9" fill="#FFF" font-weight="600" text-anchor="middle">15-25 min</text>
      <text x="12" y="104" class="text-subtitle">Napoli Artisan Pizza</text>
      <text x="12" y="120" class="text-body">Italian • Wood-fired • $ • Free Delivery</text>
      <rect x="300" y="94" width="38" height="20" rx="6" fill="#E5E7EB"/>
      <text x="319" y="108" font-size="10" font-weight="700" fill="#1F2937" text-anchor="middle">★ 4.9</text>
    </g>
  </g>

  <!-- Bottom Navigation Bar -->
  <g transform="translate(0, 764)">
    <rect width="390" height="80" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
    
    <!-- Nav Item 1 (Active) -->
    <g transform="translate(48, 14)">
      <rect x="-8" y="0" width="36" height="32" rx="8" fill="#F3F4F6"/>
      <path d="M10 4 L2 11 L4 22 L16 22 L18 11 Z" fill="#1F2937"/>
      <text x="10" y="32" font-size="9" font-weight="700" fill="#111827" text-anchor="middle">Home</text>
    </g>

    <!-- Nav Item 2 -->
    <g transform="translate(136, 14)">
      <circle cx="10" cy="11" r="6" fill="none" stroke="#9CA3AF" stroke-width="2"/>
      <line x1="14" y1="15" x2="19" y2="20" stroke="#9CA3AF" stroke-width="2"/>
      <text x="10" y="32" font-size="9" font-weight="500" fill="#9CA3AF" text-anchor="middle">Explore</text>
    </g>

    <!-- Nav Item 3 -->
    <g transform="translate(224, 14)">
      <rect x="3" y="4" width="14" height="16" rx="2" fill="none" stroke="#9CA3AF" stroke-width="2"/>
      <line x1="6" y1="9" x2="14" y2="9" stroke="#9CA3AF" stroke-width="1.5"/>
      <line x1="6" y1="13" x2="14" y2="13" stroke="#9CA3AF" stroke-width="1.5"/>
      <text x="10" y="32" font-size="9" font-weight="500" fill="#9CA3AF" text-anchor="middle">Orders</text>
    </g>

    <!-- Nav Item 4 -->
    <g transform="translate(312, 14)">
      <circle cx="10" cy="8" r="4.5" fill="none" stroke="#9CA3AF" stroke-width="2"/>
      <path d="M4 19 C4 15 16 15 16 19" fill="none" stroke="#9CA3AF" stroke-width="2"/>
      <text x="10" y="32" font-size="9" font-weight="500" fill="#9CA3AF" text-anchor="middle">Profile</text>
    </g>

    <!-- Home Indicator -->
    <rect x="125" y="60" width="140" height="4" rx="2" fill="#D1D5DB"/>
  </g>
</svg>
