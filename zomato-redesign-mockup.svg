<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 844" width="800" height="844" style="background:#0F172A; font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="zomatoRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E23744"/>
      <stop offset="100%" stop-color="#CB202D"/>
    </linearGradient>
    <linearGradient id="cleanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Title Canvas -->
  <text x="400" y="36" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle">ZOMATO UX AUDIT &amp; 3 PROPOSED REDESIGN SOLUTIONS</text>
  <text x="400" y="58" font-size="12" font-weight="600" fill="#94A3B8" text-anchor="middle">Task 3 Case Study: Side-by-Side Analysis of Existing Problems vs. Proposed Redesigns</text>

  <!-- ================= LEFT ARTBOARD: EXISTING PAIN POINTS (360 x 740) ================= -->
  <g transform="translate(30, 80)">
    <!-- Phone Mockup Shell -->
    <rect width="350" height="730" rx="36" fill="#F8FAFC" stroke="#334155" stroke-width="6"/>
    
    <!-- Header -->
    <g transform="translate(18, 20)">
      <rect width="140" height="24" rx="6" fill="#FEE2E2"/>
      <text x="70" y="16" font-size="10" font-weight="800" fill="#DC2626" text-anchor="middle">CURRENT PAIN POINTS</text>
      
      <!-- Status bar -->
      <text x="310" y="16" font-size="11" font-weight="700" fill="#0F172A" text-anchor="end">9:41</text>
    </g>

    <!-- Problem 1 Annotation Tag -->
    <g transform="translate(18, 56)">
      <rect width="314" height="150" rx="14" fill="#FFFFFF" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="4 3"/>
      <!-- Cluttered Banner simulation -->
      <rect x="12" y="12" width="290" height="40" rx="8" fill="#FEE2E2"/>
      <text x="157" y="34" font-size="11" font-weight="800" fill="#DC2626" text-anchor="middle">⚠️ GOLD EVENT PROMO BANNER</text>

      <rect x="12" y="58" width="140" height="34" rx="8" fill="#FEF3C7"/>
      <text x="82" y="78" font-size="9" font-weight="700" fill="#B45309" text-anchor="middle">District / Live Ads</text>

      <rect x="162" y="58" width="140" height="34" rx="8" fill="#E0E7FF"/>
      <text x="232" y="78" font-size="9" font-weight="700" fill="#4338CA" text-anchor="middle">Blinkit Grocery Strip</text>

      <rect x="12" y="98" width="290" height="42" rx="8" fill="#F1F5F9"/>
      <text x="157" y="122" font-size="10" font-weight="700" fill="#64748B" text-anchor="middle">Cluttered Categories (16 icons)</text>

      <!-- Pain Tag Callout -->
      <rect x="10" y="-10" width="130" height="20" rx="4" fill="#DC2626"/>
      <text x="75" y="4" font-size="9" font-weight="800" fill="#FFF" text-anchor="middle">PAIN 1: BANNER CLUTTER</text>
    </g>

    <!-- Problem 2 Annotation Tag -->
    <g transform="translate(18, 226)">
      <rect width="314" height="220" rx="14" fill="#FFFFFF" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="4 3"/>
      
      <text x="16" y="28" font-size="13" font-weight="800" fill="#0F172A">Menu Item: Royal Biryani</text>
      <text x="16" y="46" font-size="14" font-weight="800" fill="#E23744">$8.99 Listed Price</text>

      <rect x="16" y="60" width="282" height="130" rx="10" fill="#FEF2F2"/>
      <text x="26" y="80" font-size="11" font-weight="800" fill="#991B1B">Checkout Surprise Bill Breakdown:</text>
      <text x="26" y="102" font-size="10.5" fill="#4B5563">Listed Food Price: $8.99</text>
      <text x="26" y="122" font-size="10.5" fill="#DC2626">+ Restaurant Packaging: $1.50</text>
      <text x="26" y="142" font-size="10.5" fill="#DC2626">+ Platform Service Fee: $0.70</text>
      <text x="26" y="162" font-size="10.5" fill="#DC2626">+ Delivery Fee + Surge: $3.50</text>
      <line x1="26" y1="168" x2="280" y2="168" stroke="#FCA5A5" stroke-width="1"/>
      <text x="26" y="182" font-size="11" font-weight="800" fill="#0F172A">Total: $14.69 (+63% Price Inflation!)</text>

      <rect x="10" y="-10" width="150" height="20" rx="4" fill="#DC2626"/>
      <text x="85" y="4" font-size="9" font-weight="800" fill="#FFF" text-anchor="middle">PAIN 2: HIDDEN BILL SHOCK</text>
    </g>

    <!-- Problem 3 Annotation Tag -->
    <g transform="translate(18, 466)">
      <rect width="314" height="150" rx="14" fill="#FFFFFF" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="4 3"/>
      
      <text x="16" y="32" font-size="12" font-weight="800" fill="#0F172A">Ordering with Colleagues/Family</text>
      <rect x="16" y="48" width="282" height="84" rx="10" fill="#FFFBEB"/>
      <text x="26" y="70" font-size="10.5" fill="#92400E">❌ Host has to pass around unlocked phone</text>
      <text x="26" y="90" font-size="10.5" fill="#92400E">❌ Manual order collection over WhatsApp</text>
      <text x="26" y="110" font-size="10.5" fill="#92400E">❌ Manual manual bill calculation</text>

      <rect x="10" y="-10" width="150" height="20" rx="4" fill="#DC2626"/>
      <text x="85" y="4" font-size="9" font-weight="800" fill="#FFF" text-anchor="middle">PAIN 3: NO GROUP ORDERING</text>
    </g>

    <!-- Footer Summary Tag -->
    <g transform="translate(18, 640)">
      <rect width="314" height="60" rx="12" fill="#FEE2E2"/>
      <text x="157" y="24" font-size="11" font-weight="800" fill="#991B1B" text-anchor="middle">Result: Decision Fatigue &amp; Cart Dropoff</text>
      <text x="157" y="42" font-size="10" fill="#7F1D1D" text-anchor="middle">Avg 4.2 min to order • 21% checkout abandonment</text>
    </g>
  </g>


  <!-- ================= RIGHT ARTBOARD: PROPOSED REDESIGN SOLUTIONS (360 x 740) ================= -->
  <g transform="translate(420, 80)">
    <!-- Phone Mockup Shell -->
    <rect width="350" height="730" rx="36" fill="#F8FAFC" stroke="#10B981" stroke-width="6"/>

    <!-- Header -->
    <g transform="translate(18, 20)">
      <rect width="140" height="24" rx="6" fill="#D1FAE5"/>
      <text x="70" y="16" font-size="10" font-weight="800" fill="#059669" text-anchor="middle">PROPOSED REDESIGN</text>
      <text x="310" y="16" font-size="11" font-weight="700" fill="#0F172A" text-anchor="end">9:41</text>
    </g>

    <!-- Solution 1: QuickMode Toggle -->
    <g transform="translate(18, 56)">
      <rect width="314" height="150" rx="14" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5" filter="url(#cardShadow)"/>
      
      <!-- QuickMode Switch Component -->
      <g transform="translate(14, 14)">
        <rect width="286" height="38" rx="10" fill="#F1F5F9"/>
        <rect x="4" y="4" width="138" height="30" rx="8" fill="#10B981"/>
        <text x="73" y="23" font-size="11" font-weight="800" fill="#FFF" text-anchor="middle">⚡ QuickMode (ON)</text>
        <text x="210" y="23" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle">Standard Feed</text>
      </g>

      <!-- 1-Tap Reorder Strip -->
      <g transform="translate(14, 60)">
        <text x="0" y="14" font-size="11" font-weight="800" fill="#0F172A">1-Tap Re-Order (Last Meals)</text>
        <g transform="translate(0, 22)">
          <rect width="138" height="44" rx="10" fill="#FFF7ED" stroke="#FFEDD5" stroke-width="1"/>
          <text x="10" y="20" font-size="10" font-weight="800" fill="#0F172A">Paneer Tikka Roll</text>
          <text x="10" y="34" font-size="9" font-weight="700" fill="#EA580C">Re-order in 1-Click ➔</text>

          <rect x="146" y="0" width="140" height="44" rx="10" fill="#FFF7ED" stroke="#FFEDD5" stroke-width="1"/>
          <text x="156" y="20" font-size="10" font-weight="800" fill="#0F172A">Double Smash Combo</text>
          <text x="156" y="34" font-size="9" font-weight="700" fill="#EA580C">Re-order in 1-Click ➔</text>
        </g>
      </g>

      <rect x="10" y="-10" width="150" height="20" rx="4" fill="#10B981"/>
      <text x="85" y="4" font-size="9" font-weight="800" fill="#FFF" text-anchor="middle">SOL 1: ZERO-CLUTTER MODE</text>
    </g>

    <!-- Solution 2: True-Price Upfront Transparency -->
    <g transform="translate(18, 226)">
      <rect width="314" height="220" rx="14" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5" filter="url(#cardShadow)"/>
      
      <text x="16" y="26" font-size="13" font-weight="800" fill="#0F172A">Menu Item: Royal Biryani</text>

      <g transform="translate(16, 36)">
        <text x="0" y="18" font-size="18" font-weight="900" fill="#0F172A">$8.99</text>
        <!-- True-Price Transparent Pill -->
        <rect x="64" y="4" width="218" height="22" rx="6" fill="#ECFDF5"/>
        <text x="173" y="18" font-size="9.5" font-weight="800" fill="#059669" text-anchor="middle">✓ All-Inclusive: $10.45 (Incl. Taxes &amp; Box)</text>
      </g>

      <rect x="16" y="70" width="282" height="120" rx="10" fill="#F0FDF4"/>
      <text x="26" y="90" font-size="11" font-weight="800" fill="#166534">Upfront Honest Bill Transparency:</text>
      <text x="26" y="112" font-size="10.5" fill="#166534">Dish Price: $8.99</text>
      <text x="26" y="130" font-size="10.5" fill="#166534">Packaging &amp; Tax: $1.46 (Pre-Calculated)</text>
      <text x="26" y="148" font-size="10.5" fill="#166534">Delivery: Free (Zomato Pass applied)</text>
      <line x1="26" y1="156" x2="280" y2="156" stroke="#86EFAC" stroke-width="1"/>
      <text x="26" y="174" font-size="11.5" font-weight="900" fill="#0F172A">Honest Checkout: $10.45 (0 Surprise Fees)</text>

      <rect x="10" y="-10" width="160" height="20" rx="4" fill="#10B981"/>
      <text x="90" y="4" font-size="9" font-weight="800" fill="#FFF" text-anchor="middle">SOL 2: TRUE-PRICE DISPLAY</text>
    </g>

    <!-- Solution 3: Collaborative Group Cart -->
    <g transform="translate(18, 466)">
      <rect width="314" height="150" rx="14" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5" filter="url(#cardShadow)"/>
      
      <g transform="translate(16, 16)">
        <rect width="282" height="32" rx="8" fill="url(#zomatoRed)"/>
        <text x="141" y="20" font-size="11" font-weight="800" fill="#FFF" text-anchor="middle">👥 Start Group Cart &amp; Split Bill</text>
      </g>

      <!-- Live Members Joining -->
      <g transform="translate(16, 58)">
        <text x="0" y="14" font-size="11" font-weight="700" fill="#0F172A">Participants Syncing:</text>
        <g transform="translate(0, 24)">
          <circle cx="16" cy="16" r="14" fill="#FEF3C7"/>
          <text x="16" y="20" font-size="10" font-weight="800" fill="#B45309" text-anchor="middle">Anurag</text>

          <circle cx="48" cy="16" r="14" fill="#DBEAFE"/>
          <text x="48" y="20" font-size="10" font-weight="800" fill="#1D4ED8" text-anchor="middle">Priya</text>

          <circle cx="80" cy="16" r="14" fill="#DCFCE7"/>
          <text x="80" y="20" font-size="10" font-weight="800" fill="#15803D" text-anchor="middle">Rahul</text>

          <rect x="110" y="2" width="164" height="28" rx="6" fill="#F1F5F9"/>
          <text x="192" y="19" font-size="9.5" font-weight="700" fill="#334155" text-anchor="middle">Auto-Calculates Split (₹240/person)</text>
        </g>
      </g>

      <rect x="10" y="-10" width="160" height="20" rx="4" fill="#10B981"/>
      <text x="90" y="4" font-size="9" font-weight="800" fill="#FFF" text-anchor="middle">SOL 3: GROUP CART SYNC</text>
    </g>

    <!-- Footer Summary Tag -->
    <g transform="translate(18, 640)">
      <rect width="314" height="60" rx="12" fill="#D1FAE5"/>
      <text x="157" y="24" font-size="11" font-weight="800" fill="#065F46" text-anchor="middle">Expected Impact: 1.8 min Ordering Time</text>
      <text x="157" y="42" font-size="10" fill="#047857" text-anchor="middle">14% Drop in Cart Abandonment • +18% Group Orders</text>
    </g>
  </g>
</svg>
