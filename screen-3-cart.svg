<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" style="background:#FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <style>
      .box { fill: #F9FAFB; stroke: #E5E7EB; stroke-width: 1; }
      .text-title { font-size: 16px; font-weight: 700; fill: #111827; }
      .text-subtitle { font-size: 13px; font-weight: 600; fill: #374151; }
      .text-body { font-size: 11px; fill: #6B7280; }
      .btn-primary { fill: #111827; rx: 12; }
      .btn-text { font-size: 13px; font-weight: 600; fill: #FFFFFF; text-anchor: middle; }
    </style>
  </defs>

  <!-- Frame Background -->
  <rect width="390" height="844" rx="36" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2"/>

  <!-- Status Bar -->
  <text x="28" y="32" font-size="12" font-weight="600" fill="#111827">9:41</text>
  <circle cx="330" cy="28" r="3" fill="#111827"/>
  <rect x="340" y="23" width="20" height="10" rx="3" fill="none" stroke="#111827" stroke-width="1.5"/>
  <rect x="342" y="25" width="13" height="6" rx="1" fill="#111827"/>

  <!-- Top Bar Navigation -->
  <g transform="translate(20, 48)">
    <circle cx="16" cy="16" r="16" fill="#F3F4F6"/>
    <path d="M20 10 L13 16 L20 22" fill="none" stroke="#111827" stroke-width="2" stroke-linecap="round"/>
    <text x="175" y="21" class="text-title" text-anchor="middle">Review Order</text>
    <text x="350" y="21" class="text-body" fill="#EF4444" text-anchor="end">Clear</text>
  </g>

  <!-- Delivery Address Banner -->
  <g transform="translate(20, 96)">
    <rect width="350" height="62" rx="12" class="box"/>
    <circle cx="28" cy="31" r="14" fill="#E5E7EB"/>
    <!-- Pin Icon -->
    <circle cx="28" cy="28" r="4" fill="#1F2937"/>
    <path d="M28 32 L28 36" stroke="#1F2937" stroke-width="2" stroke-linecap="round"/>
    <text x="52" y="26" class="text-subtitle">Deliver to Home</text>
    <text x="52" y="42" class="text-body">742 Evergreen Terr, Apt 4B • (Est. 25-35m)</text>
    <text x="330" y="35" font-size="11" font-weight="600" fill="#4B5563" text-anchor="end">Edit</text>
  </g>

  <!-- Order Items Section -->
  <g transform="translate(20, 172)">
    <text x="0" y="12" class="text-subtitle">Burger Craft &amp; Co. (2 items)</text>
    
    <!-- Item 1 -->
    <g transform="translate(0, 24)">
      <rect width="350" height="68" rx="10" class="box"/>
      <rect x="12" y="12" width="44" height="44" rx="8" fill="#E5E7EB"/>
      <line x1="12" y1="12" x2="56" y2="56" stroke="#D1D5DB" stroke-width="1"/>
      <line x1="12" y1="56" x2="56" y2="12" stroke="#D1D5DB" stroke-width="1"/>
      
      <text x="66" y="28" class="text-subtitle">Truffle Smash Double</text>
      <text x="66" y="42" class="text-body">Extra truffle mayo, Well done</text>
      <text x="66" y="56" font-size="12" font-weight="700" fill="#111827">$12.99</text>

      <!-- Stepper -->
      <g transform="translate(262, 18)">
        <rect width="76" height="30" rx="8" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1"/>
        <text x="14" y="20" font-size="14" font-weight="700" fill="#374151" text-anchor="middle">-</text>
        <text x="38" y="19" font-size="12" font-weight="700" fill="#111827" text-anchor="middle">1</text>
        <text x="62" y="20" font-size="14" font-weight="700" fill="#374151" text-anchor="middle">+</text>
      </g>
    </g>

    <!-- Item 2 -->
    <g transform="translate(0, 100)">
      <rect width="350" height="68" rx="10" class="box"/>
      <rect x="12" y="12" width="44" height="44" rx="8" fill="#E5E7EB"/>
      <line x1="12" y1="12" x2="56" y2="56" stroke="#D1D5DB" stroke-width="1"/>
      <line x1="12" y1="56" x2="56" y2="12" stroke="#D1D5DB" stroke-width="1"/>
      
      <text x="66" y="28" class="text-subtitle">Seasoned Waffle Fries</text>
      <text x="66" y="42" class="text-body">Large size, Garlic aioli dip</text>
      <text x="66" y="56" font-size="12" font-weight="700" fill="#111827">$4.50</text>

      <g transform="translate(262, 18)">
        <rect width="76" height="30" rx="8" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1"/>
        <text x="14" y="20" font-size="14" font-weight="700" fill="#374151" text-anchor="middle">-</text>
        <text x="38" y="19" font-size="12" font-weight="700" fill="#111827" text-anchor="middle">1</text>
        <text x="62" y="20" font-size="14" font-weight="700" fill="#374151" text-anchor="middle">+</text>
      </g>
    </g>
  </g>

  <!-- Promo Code Input -->
  <g transform="translate(20, 362)">
    <rect width="350" height="46" rx="10" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="16" y="28" class="text-body" fill="#6B7280">🎟 Have a promo or coupon code?</text>
    <rect x="274" y="8" width="66" height="30" rx="6" fill="#1F2937"/>
    <text x="307" y="27" font-size="11" font-weight="600" fill="#FFF" text-anchor="middle">Apply</text>
  </g>

  <!-- Bill Summary Breakdown -->
  <g transform="translate(20, 426)">
    <rect width="350" height="152" rx="12" class="box"/>
    <text x="16" y="26" class="text-subtitle">Bill Details</text>
    
    <text x="16" y="52" class="text-body">Item Subtotal</text>
    <text x="334" y="52" font-size="11" font-weight="600" fill="#111827" text-anchor="end">$17.49</text>

    <text x="16" y="74" class="text-body">Delivery Partner Fee</text>
    <text x="334" y="74" font-size="11" font-weight="600" fill="#111827" text-anchor="end">$1.99</text>

    <text x="16" y="96" class="text-body">Taxes &amp; Restaurant Packaging</text>
    <text x="334" y="96" font-size="11" font-weight="600" fill="#111827" text-anchor="end">$1.85</text>

    <line x1="16" y1="112" x2="334" y2="112" stroke="#E5E7EB" stroke-width="1"/>

    <text x="16" y="136" font-size="14" font-weight="700" fill="#111827">Total To Pay</text>
    <text x="334" y="136" font-size="15" font-weight="700" fill="#111827" text-anchor="end">$21.33</text>
  </g>

  <!-- Payment Selection Card -->
  <g transform="translate(20, 594)">
    <rect width="350" height="54" rx="10" class="box"/>
    <rect x="14" y="14" width="38" height="26" rx="4" fill="#1F2937"/>
    <text x="33" y="31" font-size="9" font-weight="700" fill="#FFF" text-anchor="middle">CARD</text>
    <text x="62" y="28" class="text-subtitle">Apple Pay / Visa •••• 4242</text>
    <text x="62" y="42" class="text-body">Instant 1-Click Payment</text>
    <text x="334" y="33" font-size="11" font-weight="600" fill="#4B5563" text-anchor="end">Change</text>
  </g>

  <!-- Sticky Place Order Button -->
  <g transform="translate(20, 726)">
    <rect width="350" height="54" rx="14" fill="#111827"/>
    <text x="30" y="33" font-size="13" font-weight="700" fill="#FFFFFF">$21.33 Total</text>
    <text x="320" y="33" class="btn-text" text-anchor="end">Place Order ➔</text>
  </g>

  <!-- Home Indicator -->
  <rect x="125" y="824" width="140" height="4" rx="2" fill="#D1D5DB"/>
</svg>
