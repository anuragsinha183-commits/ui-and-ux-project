<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" style="background:#F8FAFC; font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#FF3E1D"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <filter id="riderShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#FF3E1D" flood-opacity="0.4"/>
    </filter>
    <clipPath id="phoneClip">
      <rect width="390" height="844" rx="40"/>
    </clipPath>
    <clipPath id="mapClip">
      <rect width="390" height="340"/>
    </clipPath>
  </defs>

  <g clip-path="url(#phoneClip)">
    <rect width="390" height="844" fill="#F8FAFC"/>

    <!-- Map Canvas Area -->
    <g clip-path="url(#mapClip)">
      <rect width="390" height="340" fill="#E2E8F0"/>
      <!-- Water body -->
      <path d="M 0 0 Q 60 120 0 240 L 0 0 Z" fill="#BFDBFE" opacity="0.6"/>
      <!-- Urban Green Parks -->
      <rect x="220" y="20" width="80" height="60" rx="14" fill="#BBF7D0" opacity="0.7"/>
      <rect x="50" y="220" width="100" height="70" rx="16" fill="#BBF7D0" opacity="0.7"/>

      <!-- Stylized Road Networks -->
      <path d="M 20 60 Q 200 110 370 40" fill="none" stroke="#FFFFFF" stroke-width="12"/>
      <path d="M 40 280 Q 200 200 370 290" fill="none" stroke="#FFFFFF" stroke-width="12"/>
      <path d="M 120 10 L 150 330" fill="none" stroke="#FFFFFF" stroke-width="14"/>
      <path d="M 260 20 L 280 330" fill="none" stroke="#FFFFFF" stroke-width="14"/>
      
      <!-- Primary Highway connecting Restaurant to Home -->
      <path d="M 70 210 C 130 210, 150 110, 300 90" fill="none" stroke="#CBD5E1" stroke-width="8"/>
      <!-- Completed Route Section -->
      <path d="M 70 210 C 130 210, 160 140, 205 130" fill="none" stroke="#FF5A26" stroke-width="6" stroke-linecap="round"/>
      <!-- Remaining Dotted Route -->
      <path d="M 205 130 C 235 125, 270 110, 300 90" fill="none" stroke="#FF5A26" stroke-width="5" stroke-dasharray="6 6" stroke-linecap="round"/>

      <!-- Restaurant Location Pin -->
      <g transform="translate(70, 210)">
        <circle cx="0" cy="0" r="16" fill="#FFFFFF" filter="url(#softShadow)"/>
        <circle cx="0" cy="0" r="12" fill="#0F172A"/>
        <text x="0" y="4" font-size="10" text-anchor="middle">🍔</text>
        <rect x="-38" y="20" width="76" height="18" rx="6" fill="#0F172A" opacity="0.9"/>
        <text x="0" y="32" font-size="8.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Burger Craft</text>
      </g>

      <!-- Customer Destination Pin (Home) -->
      <g transform="translate(300, 90)">
        <circle cx="0" cy="0" r="18" fill="#FFFFFF" filter="url(#softShadow)"/>
        <circle cx="0" cy="0" r="14" fill="#10B981"/>
        <text x="0" y="4" font-size="10" text-anchor="middle">🏠</text>
        <rect x="-26" y="22" width="52" height="18" rx="6" fill="#10B981"/>
        <text x="0" y="34" font-size="8.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">Home</text>
      </g>

      <!-- Active Courier Real-Time Vehicle Marker -->
      <g transform="translate(205, 130)" filter="url(#riderShadow)">
        <circle cx="0" cy="0" r="22" fill="#FF5A26"/>
        <circle cx="0" cy="0" r="18" fill="#FFFFFF"/>
        <text x="0" y="5" font-size="13" text-anchor="middle">🛵</text>
        <!-- Pulse ring -->
        <circle cx="0" cy="0" r="28" fill="none" stroke="#FF5A26" stroke-width="2" opacity="0.4"/>
      </g>
    </g>

    <!-- Top Floating Header on Map -->
    <g transform="translate(20, 48)">
      <circle cx="18" cy="18" r="18" fill="#FFFFFF" filter="url(#softShadow)"/>
      <path d="M21 12 L14 18 L21 24" fill="none" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      
      <g transform="translate(175, 4)">
        <rect x="-70" y="0" width="140" height="32" rx="16" fill="#FFFFFF" filter="url(#softShadow)"/>
        <circle cx="-50" cy="16" r="4" fill="#10B981"/>
        <text x="5" y="20" font-size="11" font-weight="800" fill="#0F172A" text-anchor="middle">Order #QB-8942</text>
      </g>

      <g transform="translate(314, 0)">
        <circle cx="18" cy="18" r="18" fill="#FFFFFF" filter="url(#softShadow)"/>
        <text x="18" y="22" font-size="12" font-weight="800" fill="#475569" text-anchor="middle">SOS</text>
      </g>
    </g>

    <!-- Live Status Tracking Modal Card -->
    <g transform="translate(20, 310)" filter="url(#softShadow)">
      <rect width="350" height="430" rx="24" fill="#FFFFFF"/>

      <!-- ETA Header Strip -->
      <g transform="translate(22, 24)">
        <g>
          <text x="0" y="10" font-size="10.5" font-weight="800" fill="#94A3B8" letter-spacing="0.5">ESTIMATED ARRIVAL</text>
          <text x="0" y="36" font-size="24" font-weight="900" fill="#0F172A">18 - 22 mins</text>
        </g>
        
        <g transform="translate(306, 12)">
          <rect x="-80" y="0" width="80" height="26" rx="13" fill="#ECFDF5"/>
          <circle cx="-68" cy="13" r="3" fill="#10B981"/>
          <text x="-36" y="17" font-size="10" font-weight="800" fill="#059669" text-anchor="middle">ON TIME</text>
        </g>
      </g>

      <!-- 4-Step Animated Timeline Progress Track -->
      <g transform="translate(22, 94)">
        <!-- Inactive base track -->
        <line x1="12" y1="12" x2="294" y2="12" stroke="#F1F5F9" stroke-width="4" stroke-linecap="round"/>
        <!-- Active track -->
        <line x1="12" y1="12" x2="200" y2="12" stroke="#FF5A26" stroke-width="4" stroke-linecap="round"/>

        <!-- Step 1: Confirmed -->
        <circle cx="12" cy="12" r="10" fill="#FF5A26"/>
        <path d="M9 12 L11 14 L15 10" fill="none" stroke="#FFF" stroke-width="2" stroke-linecap="round"/>
        <text x="12" y="34" font-size="10" font-weight="700" fill="#0F172A" text-anchor="middle">Placed</text>

        <!-- Step 2: Kitchen -->
        <circle cx="106" cy="12" r="10" fill="#FF5A26"/>
        <path d="M103 12 L105 14 L109 10" fill="none" stroke="#FFF" stroke-width="2" stroke-linecap="round"/>
        <text x="106" y="34" font-size="10" font-weight="700" fill="#0F172A" text-anchor="middle">Kitchen</text>

        <!-- Step 3: On The Way (Active Pulse) -->
        <circle cx="200" cy="12" r="12" fill="#FF5A26"/>
        <circle cx="200" cy="12" r="5" fill="#FFFFFF"/>
        <text x="200" y="34" font-size="10" font-weight="800" fill="#FF5A26" text-anchor="middle">On Way</text>

        <!-- Step 4: Delivered -->
        <circle cx="294" cy="12" r="10" fill="#E2E8F0"/>
        <text x="294" y="34" font-size="10" font-weight="600" fill="#94A3B8" text-anchor="middle">Arrived</text>
      </g>

      <line x1="22" y1="150" x2="328" y2="150" stroke="#F1F5F9" stroke-width="1.5"/>

      <!-- Driver Contact Card -->
      <g transform="translate(22, 168)">
        <!-- Courier Avatar -->
        <circle cx="24" cy="24" r="24" fill="#FFEDD5"/>
        <circle cx="24" cy="18" r="9" fill="#EA580C"/>
        <path d="M11 36 C11 28 37 28 37 36" fill="#EA580C"/>
        <!-- Star badge -->
        <circle cx="38" cy="10" r="7" fill="#F59E0B"/>
        <text x="38" y="13" font-size="8" font-weight="800" fill="#FFF" text-anchor="middle">★</text>

        <g transform="translate(60, 10)">
          <text x="0" y="14" font-size="14" font-weight="800" fill="#0F172A">David Miller</text>
          <text x="0" y="28" font-size="10.5" font-weight="600" fill="#64748B">Honda Super Cub • 7X-204</text>
        </g>

        <!-- Chat CTA -->
        <g transform="translate(230, 6)">
          <circle cx="18" cy="18" r="18" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
          <path d="M12 18 C12 15 15 12 19 12 C23 12 26 15 26 18 C26 21 23 24 19 24 C17 24 15 23.5 13.5 22.5 L11 23 L11.5 20.5" fill="none" stroke="#0F172A" stroke-width="1.5"/>
        </g>

        <!-- Call CTA -->
        <g transform="translate(272, 6)">
          <circle cx="18" cy="18" r="18" fill="url(#primaryGrad)"/>
          <path d="M14 13 C14 13 15 16 16 16 C17 16 18 15 19 15 C20 15 22 17 22 18 C22 19 21 20 21 21 C21 22 24 23 24 23" fill="none" stroke="#FFF" stroke-width="2" stroke-linecap="round"/>
        </g>
      </g>

      <line x1="22" y1="234" x2="328" y2="234" stroke="#F1F5F9" stroke-width="1.5"/>

      <!-- Order Summary Strip -->
      <g transform="translate(22, 252)">
        <text x="0" y="12" font-size="13" font-weight="800" fill="#0F172A">Burger Craft &amp; Co.</text>
        <text x="306" y="12" font-size="13" font-weight="800" fill="#FF5A26" text-anchor="end">$12.18</text>
        <text x="0" y="30" font-size="11" font-weight="500" fill="#64748B">1x Truffle Smash Double, 1x Waffle Fries</text>
      </g>

      <!-- View Receipt / Help Button -->
      <g transform="translate(22, 310)">
        <rect width="306" height="46" rx="14" fill="#F1F5F9"/>
        <text x="153" y="28" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">View Receipt &amp; Order Details</text>
      </g>
    </g>

    <rect x="130" y="824" width="130" height="4" rx="2" fill="#0F172A"/>
  </g>
</svg>
